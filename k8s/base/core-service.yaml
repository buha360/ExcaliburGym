apiVersion: apps/v1
kind: Deployment
metadata:
  name: core-service
  namespace: excalibur-gym
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: core-service
  template:
    metadata:
      labels:
        app.kubernetes.io/name: core-service
        app.kubernetes.io/part-of: excalibur-gym
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: core-service
          image: ghcr.io/buha360/excalibur-gym-core:latest
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
          envFrom:
            - configMapRef:
                name: excalibur-config
            - secretRef:
                name: excalibur-core-secrets
          startupProbe:
            httpGet:
              path: /actuator/health/liveness
              port: http
            failureThreshold: 30
            periodSeconds: 5
          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: http
            periodSeconds: 10
            timeoutSeconds: 3
          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: http
            periodSeconds: 20
            timeoutSeconds: 3
          resources:
            requests:
              cpu: 150m
              memory: 256Mi
            limits:
              cpu: "1"
              memory: 768Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
            readOnlyRootFilesystem: true
          volumeMounts:
            - name: temporary-files
              mountPath: /tmp
      volumes:
        - name: temporary-files
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: core-service
  namespace: excalibur-gym
spec:
  selector:
    app.kubernetes.io/name: core-service
  ports:
    - name: http
      port: 8080
      targetPort: http

