apiVersion: apps/v1
kind: Deployment
metadata:
  name: solarium-service
  namespace: excalibur-gym
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: solarium-service
  template:
    metadata:
      labels:
        app.kubernetes.io/name: solarium-service
        app.kubernetes.io/part-of: excalibur-gym
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: solarium-service
          image: ghcr.io/buha360/excalibur-gym-solarium:latest
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8083
          envFrom:
            - configMapRef:
                name: excalibur-config
            - secretRef:
                name: excalibur-solarium-secrets
          startupProbe:
            httpGet: { path: /actuator/health/liveness, port: http }
            failureThreshold: 30
            periodSeconds: 5
          readinessProbe:
            httpGet: { path: /actuator/health/readiness, port: http }
            periodSeconds: 10
            timeoutSeconds: 3
          livenessProbe:
            httpGet: { path: /actuator/health/liveness, port: http }
            periodSeconds: 20
            timeoutSeconds: 3
          resources:
            requests: { cpu: 100m, memory: 192Mi }
            limits: { cpu: "1", memory: 512Mi }
          securityContext:
            allowPrivilegeEscalation: false
            capabilities: { drop: ["ALL"] }
            readOnlyRootFilesystem: true
          volumeMounts:
            - name: temporary-files
              mountPath: /tmp
      volumes:
        - name: temporary-files
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: solarium-service
  namespace: excalibur-gym
spec:
  selector:
    app.kubernetes.io/name: solarium-service
  ports:
    - name: http
      port: 8083
      targetPort: http
