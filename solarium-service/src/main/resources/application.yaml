spring:
  application:
    name: excalibur-solarium-service
  datasource:
    url: ${SOLARIUM_DATABASE_URL}
    username: ${SOLARIUM_DATABASE_USERNAME}
    password: ${SOLARIUM_DATABASE_PASSWORD}
    driver-class-name: org.postgresql.Driver
  liquibase:
    change-log: classpath:db/changelog/db.changelog-master.yaml
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS}
    producer:
      acks: all
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
      properties:
        enable.idempotence: true

excalibur:
  internal-api-key: ${SOLARIUM_INTERNAL_API_KEY}
  events:
    dispatch-delay-ms: 500

server:
  port: 8083

management:
  endpoint:
    health:
      probes:
        enabled: true
  endpoints:
    web:
      exposure:
        include: health,info
