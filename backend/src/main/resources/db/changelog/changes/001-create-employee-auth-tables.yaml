databaseChangeLog:
  - changeSet:
      id: 001-create-employee-account
      author: codex
      changes:
        - createTable:
            tableName: employee_account
            columns:
              - column:
                  name: id
                  type: VARCHAR(36)
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: display_name
                  type: VARCHAR(120)
                  constraints:
                    nullable: false
              - column:
                  name: pin_hash
                  type: VARCHAR(255)
                  constraints:
                    nullable: false
              - column:
                  name: role
                  type: VARCHAR(20)
                  constraints:
                    nullable: false
              - column:
                  name: enabled
                  type: BOOLEAN
                  defaultValueBoolean: true
                  constraints:
                    nullable: false
              - column:
                  name: created_at
                  type: TIMESTAMP
                  constraints:
                    nullable: false
              - column:
                  name: updated_at
                  type: TIMESTAMP
                  constraints:
                    nullable: false
        - createIndex:
            tableName: employee_account
            indexName: idx_employee_account_display_name
            columns:
              - column:
                  name: display_name

  - changeSet:
      id: 002-create-employee-login-event
      author: codex
      changes:
        - createTable:
            tableName: employee_login_event
            columns:
              - column:
                  name: id
                  type: VARCHAR(36)
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: employee_id
                  type: VARCHAR(36)
                  constraints:
                    nullable: false
                    foreignKeyName: fk_login_event_employee
                    references: employee_account(id)
              - column:
                  name: event_type
                  type: VARCHAR(20)
                  constraints:
                    nullable: false
              - column:
                  name: occurred_at
                  type: TIMESTAMP
                  constraints:
                    nullable: false
        - createIndex:
            tableName: employee_login_event
            indexName: idx_login_event_employee_occurred_at
            columns:
              - column:
                  name: employee_id
              - column:
                  name: occurred_at
