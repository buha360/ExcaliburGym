databaseChangeLog:
  - changeSet:
      id: 004-create-audit-log
      author: codex
      changes:
        - createTable:
            tableName: audit_log
            columns:
              - column:
                  name: id
                  type: VARCHAR(36)
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: employee_id
                  type: VARCHAR(36)
                  constraints:
                    nullable: false
                    foreignKeyName: fk_audit_log_employee
                    references: employee_account(id)
              - column:
                  name: employee_name
                  type: VARCHAR(120)
                  constraints:
                    nullable: false
              - column:
                  name: action
                  type: VARCHAR(60)
                  constraints:
                    nullable: false
              - column:
                  name: entity_type
                  type: VARCHAR(60)
                  constraints:
                    nullable: false
              - column:
                  name: entity_id
                  type: VARCHAR(36)
              - column:
                  name: summary
                  type: VARCHAR(300)
                  constraints:
                    nullable: false
              - column:
                  name: details
                  type: VARCHAR(1000)
              - column:
                  name: occurred_at
                  type: TIMESTAMP
                  constraints:
                    nullable: false
        - createIndex:
            tableName: audit_log
            indexName: idx_audit_log_occurred_at
            columns:
              - column:
                  name: occurred_at
        - createIndex:
            tableName: audit_log
            indexName: idx_audit_log_employee_occurred_at
            columns:
              - column:
                  name: employee_id
              - column:
                  name: occurred_at
