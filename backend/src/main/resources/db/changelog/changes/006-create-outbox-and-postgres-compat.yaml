databaseChangeLog:
  - changeSet:
      id: 009-add-default-product-price-postgresql
      author: codex
      dbms: postgresql
      changes:
        - addColumn:
            tableName: product_definition
            columns:
              - column:
                  name: default_price
                  type: BIGINT
                  defaultValueNumeric: 0
                  constraints:
                    nullable: false

  - changeSet:
      id: 010-create-outbox-event
      author: codex
      changes:
        - createTable:
            tableName: outbox_event
            columns:
              - column:
                  name: id
                  type: VARCHAR(36)
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: topic
                  type: VARCHAR(160)
                  constraints:
                    nullable: false
              - column:
                  name: aggregate_id
                  type: VARCHAR(36)
                  constraints:
                    nullable: false
              - column:
                  name: payload
                  type: CLOB
                  constraints:
                    nullable: false
              - column:
                  name: occurred_at
                  type: VARCHAR(40)
                  constraints:
                    nullable: false
              - column:
                  name: published_at
                  type: VARCHAR(40)
              - column:
                  name: attempts
                  type: INTEGER
                  defaultValueNumeric: 0
                  constraints:
                    nullable: false
              - column:
                  name: last_error
                  type: VARCHAR(1000)
        - createIndex:
            tableName: outbox_event
            indexName: idx_outbox_unpublished_occurred
            columns:
              - column:
                  name: published_at
              - column:
                  name: occurred_at
