spring:
  application:
    name: excalibur-core-service
  datasource:
    url: "jdbc:sqlite:${EXCALIBUR_DB_PATH:./data/excalibur-gym.db}"
    driver-class-name: org.sqlite.JDBC
    hikari:
      maximum-pool-size: 1
      connection-init-sql: "PRAGMA foreign_keys=ON"
  liquibase:
    change-log: classpath:db/changelog/db.changelog-master.yaml
  sql:
    init:
      mode: never

excalibur:
  events:
    publishing-enabled: false
  reporting:
    mode: local
  sauna:
    base-url: ${SAUNA_SERVICE_URL:http://localhost:8082}
    internal-api-key: ${SAUNA_INTERNAL_API_KEY:local-dev-only}
  solarium:
    base-url: ${SOLARIUM_SERVICE_URL:http://localhost:8083}
    internal-api-key: ${SOLARIUM_INTERNAL_API_KEY:local-dev-only}

server:
  port: 8080
  servlet:
    session:
      timeout: 12h
      cookie:
        http-only: true
        same-site: strict

management:
  endpoint:
    health:
      probes:
        enabled: true
  endpoints:
    web:
      exposure:
        include: health,info