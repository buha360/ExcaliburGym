spring:
  datasource:
    url: "jdbc:sqlite:file:excalibur-test?mode=memory&cache=shared"
    driver-class-name: org.sqlite.JDBC
    hikari:
      maximum-pool-size: 1
      connection-init-sql: "PRAGMA foreign_keys=ON"

excalibur:
  sauna:
    base-url: http://localhost:18082
    internal-api-key: test-internal-key
  solarium:
    base-url: http://localhost:18083
    internal-api-key: test-internal-key
